<script>
// One-link fallback for Poca Craft (onelink.to/ezmvvz "fallback" + profile links).
// Android -> Play, iPhone/iPad -> App Store (once live), everything else stays on this page.
// ?s=<source>&c=<campaign> go into the Play install referrer (PostHog install_source/campaign) and App Store ct.
// ?l=<lang> forces a language. No cookies, no trackers.
var PLAY = "https://play.google.com/store/apps/details?id=com.syddstudio.casual.pocacraft";
// Set ahead of App Store approval (2026-10-10, user call): the one-link only goes public once iOS is live anyway.
//   Empty this again to hide the App Store button and show "coming soon" instead.
var APPSTORE_ID = "id6817077446";
// Languages = the app's and the Play listing's (ko·en). Add one here only when the app ships it —
// otherwise a visitor reads their language here and lands on an English store page and app.
// Fan vocabulary: ko 최애·탑꾸 / en bias·toploader.
var I18N = {
  ko: { hl: "ko", title: "포카 꾸미기", sub: "2D 스티커 말고 크림으로 3D 탑꾸. 진짜 크림·진주·큐빅으로 최애 포카를 꾸며요.", play: "Google Play에서 받기", ios: "App Store에서 받기", soon: "iPhone 버전은 곧 나와요", small: "무료 · Android · iPhone", alt: "포카 꾸미기 아이콘", doc: "포카 꾸미기 - 최애 탑꾸 포꾸 3D 데코 | SYDD Studio" },
  en: { hl: "en", title: "Poca Craft", sub: "Kpop toploader deco for your bias. Pipe real cream, press pearls & gems in 3D.", play: "Get it on Google Play", ios: "Download on the App Store", soon: "iPhone version coming soon", small: "Free · Android · iPhone", alt: "Poca Craft icon", doc: "Poca Craft: Kpop Photocard DIY | SYDD Studio" }
};
// ?l=ko|en overrides; otherwise the first of navigator.languages that we have. Anything else -> en.
function pickLang(search, langs) {
  var m = /[?&]l=([^&#]*)/.exec(search || "");
  if (m && I18N[m[1]]) return m[1];
  for (var i = 0; i < (langs || []).length; i++) {
    var base = String(langs[i]).toLowerCase().split(/[-_]/)[0];
    if (I18N[base]) return base;
  }
  return "";
}
// MATCHED = the visitor's language is one we have. Only then pass hl= to Play — otherwise a Thai phone
// would get Play's whole UI in English; without hl Play keeps the visitor's UI and shows our en listing anyway.
var LANG = "en", MATCHED = false;
try { var picked = pickLang(location.search, navigator.languages || [navigator.language]); if (picked) { LANG = picked; MATCHED = true; } } catch (e) {}
var T = I18N[LANG];
function param(search, k) {
  var m = new RegExp("[?&]" + k + "=([^&#]*)").exec(search || "");
  var v = m ? m[1].toLowerCase() : "";
  return /^[a-z0-9_-]{1,32}$/.test(v) ? v : "";
}
function storeLinks(search) {
  var s = param(search, "s"), c = param(search, "c");
  var ref = s ? "utm_source=" + s + (c ? "&utm_campaign=" + c : "") : "";
  // No storefront code: apps.apple.com/app/<id> opens the visitor's own country store (English-page visitors are in many countries).
  var ios = APPSTORE_ID ? "https://apps.apple.com/app/" + APPSTORE_ID + (s ? "?ct=" + s : "") : "";
  return { play: PLAY + (MATCHED ? "&hl=" + T.hl : "") + (ref ? "&referrer=" + encodeURIComponent(ref) : ""), ios: ios };
}
function pickStore(ua, touchPoints) {
  if (/Android/i.test(ua)) return "play";
  if (/iPhone|iPad|iPod/.test(ua) || (/Macintosh/.test(ua) && touchPoints > 1)) return "ios";
  return "";
}
try {
  var L = storeLinks(location.search);
  var P = pickStore(navigator.userAgent || "", navigator.maxTouchPoints || 0);
  if (P && L[P]) location.replace(L[P]);
} catch (e) {}
</script>

<script>
try {
  var L2 = storeLinks(location.search);
  document.getElementById("play").href = L2.play;
  if (L2.ios) {
    document.getElementById("ios").href = L2.ios;
    document.getElementById("ios").hidden = false;
    document.getElementById("soon").hidden = true;
  }
  document.documentElement.lang = LANG;
  document.title = T.doc;
  document.getElementById("t").textContent = T.title;
  document.getElementById("sub").textContent = T.sub;
  document.getElementById("play").textContent = T.play;
  document.getElementById("ios").textContent = T.ios;
  document.getElementById("soon").textContent = T.soon;
  document.getElementById("small").firstChild.nodeValue = T.small;

} catch (e) {}
</script>
